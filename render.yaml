services:
  # Backend FastAPI Web Service (Docker)
  - type: web
    name: mockmate-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mockmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

  # Frontend Next.js Web Service (Docker)
  - type: web
    name: mockmate-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mockmate-backend-hhge.onrender.com/api
      - key: BACKEND_URL
        value: https://mockmate-backend-hhge.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: mockmate-db
    region: oregon
    plan: free
    databaseName: mockmate
    user: mockmate_user
